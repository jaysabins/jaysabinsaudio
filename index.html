<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jay Sabins | Sound Designer / Game Developer</title>
  <meta name="description" content="Jay Sabins is a sound designer and game developer working on AAA titles, including Borderlands 4. Watch the demo reel.">
  <link rel="canonical" href="https://jaysabinsaudio.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jay Sabins | Sound Designer / Game Developer">
  <meta property="og:description" content="Demo reel, shipped games, and audio tools.">
  <meta property="og:url" content="https://jaysabinsaudio.com/">
  <!-- TODO: OG image (reel still plus name), 1200x630 -->
  <!-- <meta property="og:image" content="https://jaysabinsaudio.com/assets/og/og.jpg"> -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Sora:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/site.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Jay Sabins",
    "jobTitle": "Sound Designer",
    "url": "https://jaysabinsaudio.com/",
    "sameAs": [
      "https://github.com/jaysabins"
    ]
  }
  </script><!-- TODO: add LinkedIn URL to sameAs -->
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header wrap" id="top">
    <a class="brand" href="#top">
      <span class="brand-name">Jay Sabins</span>
      <span class="brand-role">Sound Designer / Game Developer</span>
    </a>
    <nav aria-label="Sections">
      <a href="#work">Work</a>
      <a href="#tech">Tech</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section class="wrap" aria-label="Demo reel">
      <div class="reel" id="reel">
        <button class="reel-play" id="reel-play" type="button">
          <span class="play-disc" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </span>
          <span class="reel-label" id="reel-label">Play demo reel</span>
        </button>
        <p class="reel-meta mono" id="reel-meta" hidden></p>
      </div>
    </section>

    <section class="section wrap" id="work" aria-labelledby="work-h">
      <h2 id="work-h">Games <span class="slash">/</span></h2>
      <ul class="grid games" id="games"></ul>
    </section>

    <section class="section wrap" id="tech" aria-labelledby="tech-h">
      <h2 id="tech-h">Tech <span class="slash">/</span></h2>
      <div class="grid" id="tech-list"></div>
    </section>

    <section class="section wrap" id="about" aria-labelledby="about-h">
      <h2 id="about-h">About <span class="slash">/</span></h2>
      <div class="about">
        <div class="bio" id="bio"></div>
        <div class="about-side">
          <ul class="disciplines" id="disciplines"></ul>
          <p class="tools mono" id="tools" hidden></p>
          <a class="btn btn-ghost" id="resume" hidden download>Résumé (PDF)</a>
        </div>
      </div>
    </section>

    <section class="section wrap" id="contact" aria-labelledby="contact-h">
      <h2 id="contact-h">Contact <span class="slash">/</span></h2>
      <div class="contact">
        <form class="form" id="contact-form" method="POST">
          <p class="hp" aria-hidden="true"><label>Leave this empty <input name="_gotcha" tabindex="-1" autocomplete="off"></label></p>
          <label>Name <input name="name" autocomplete="name" required></label>
          <label>Email <input name="email" type="email" autocomplete="email" required></label>
          <label>Message <textarea name="message" rows="5" required></textarea></label>
          <button class="btn btn-primary" type="submit">Send message</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
        <div class="contact-side">
          <p class="email" id="email" hidden></p>
          <ul class="links" id="links"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer wrap">
    <span>© <span id="year">2026</span> Jay Sabins</span>
    <a href="https://sabinssound.com">I also make tools and sound libraries at Sabins Sound →</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
  <script src="js/accent-picker.js"></script><!-- design-time only: remove before launch -->
</body>
</html>
