# Builds one GitHub Pages site from two branches:
#   main    -> /          (live; shows holding/index.html while that folder exists on main)
#   staging -> /<STAGING_PATH>/  (preview; noindex). STAGING_PATH is a repo secret holding a
#              hard-to-guess folder name, so the address isn't in this public file. Unset = "staging".
name: Deploy Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: live }
      - uses: actions/checkout@v4
        with: { ref: staging, path: stage }

      - name: Assemble site
        env:
          STAGE: ${{ secrets.STAGING_PATH || 'staging' }}
        run: |
          mkdir -p "_site/$STAGE"
          if [ -d live/holding ]; then
            cp live/holding/index.html _site/index.html
            cp -r live/css live/assets _site/
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          else
            cp -r live/. _site/
            rm -rf _site/.git _site/.github _site/holding _site/*.md
            # No staging line here: listing it would publish the hidden address. Staging pages carry noindex instead.
            printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          fi
          cp -r stage/. "_site/$STAGE/"
          rm -rf "_site/$STAGE/.git" "_site/$STAGE/.github" "_site/$STAGE/holding" "_site/$STAGE"/*.md
          sed -i 's|<head>|<head>\n  <meta name="robots" content="noindex">|' "_site/$STAGE"/*.html
          # Cache-bust local CSS/JS so a normal reload picks up each deploy (Pages lets browsers cache for 10 min).
          for f in _site/*.html "_site/$STAGE"/*.html; do
            sed -i -E "s#(src|href)=\"((css|js)/[^\"?]+)\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" "$f"
          done
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { retention-days: 1 }  # the build bundle includes staging; keep it downloadable as briefly as possible
      - id: deployment
        uses: actions/deploy-pages@v4
