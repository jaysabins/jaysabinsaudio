<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jay Sabins | Sound Designer</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d0f">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Jost:wght@250;300;400;500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);padding:24px}
    .wordmark{display:flex;align-items:center;gap:14px;font:400 14px/1 var(--title);letter-spacing:.28em;text-transform:uppercase}
    .meter{display:flex;align-items:center;gap:2px;height:18px}
    .meter i{display:block;width:2px;background:var(--fg);border-radius:1px}
    .meter i:nth-child(1),.meter i:nth-child(5){height:7px}
    .meter i:nth-child(2),.meter i:nth-child(4){height:12px}
    .meter i:nth-child(3){height:18px;background:var(--accent)}
    p{margin:18px 0 0;font:400 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
  </style>
</head>
<body>
  <main>
    <div class="wordmark"><span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Jay Sabins</div>
    <p>Sound designer · New site soon</p>
  </main>
</body>
</html>
